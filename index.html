<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Bootstrap Login Page</title>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<nav class="navbar navbar-expand-lg bg-danger">
  <div class="container-fluid">
    <a class="navbar-brand text-white fw-bold" href="#">Ruang Baca</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link text-white" href="#">Beranda</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="#">Tentang</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="#">Bantuan</a></li>
      </ul>
    </div>
  </div>
</nav>

<body>
 <div class="container vh-100 d-flex justify-content-center align-items-center">
   <div class="card p-4 shadow-lg" style="width: 25rem;">
     <h3 class="text-center mb-4">Masuk ke Ruang Baca</h3>
     <p class="text-center mb-2">Temukan bacaan untuk hari ini.</p>
     <form>

       <div class="mb-3">
         <label for="email" class="form-label">Email address</label>
         <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
       </div>
  
       <div class="mb-3">
         <label for="password" class="form-label">Password</label>
         <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
       </div>

       <div class="mb-3 form-check">
         <input type="checkbox" class="form-check-input" id="rememberMe">
         <label class="form-check-label" for="rememberMe">Remember me</label>
       </div>

       <button type="submit" class="btn btn-danger w-100">Login</button>

       <div class="text-center mt-3">
         <a href="#" class="text-decoration-none">Forgot password?</a><br>
         <span>Don't have an account? <a href="#" class="text-decoration-none">Register</a></span>
       </div>
     </form>
   </div>
 </div>
 
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
